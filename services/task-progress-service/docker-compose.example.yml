services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_progress
      POSTGRES_USER: task_progress
      POSTGRES_PASSWORD: task_progress
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_progress -d task_progress"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  task-progress-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      ENV: local
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://task_progress:task_progress@postgres:5432/task_progress?sslmode=disable
      JWT_SECRET: change-me-in-production
      ALLOW_GATEWAY_HEADERS: "true"
      RECOMMENDATION_WAIT_TIMEOUT: 2m
      ANALYTICS_INTERNAL_URL: http://analytics-service:8083
      HINT_GENERATION_TIMEOUT: 15s
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC_PLAYGROUND_EXECUTION_COMPLETED: playground.execution.completed
      KAFKA_TOPIC_ANALYTICS_SKILL_ASSESSMENT_UPDATED: analytics.skill_assessment.updated
      KAFKA_TOPIC_TASK_CHECKED: task.checked
      KAFKA_TOPIC_TASK_COMPLETED: task.completed
      KAFKA_TOPIC_TASK_RECOMMENDED: task.recommended
      KAFKA_TOPIC_LEARNER_MODEL_UPDATED: learner_model.updated
    ports:
      - "8082:8082"
