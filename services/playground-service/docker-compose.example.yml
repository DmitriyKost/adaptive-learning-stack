services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playground
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playground"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  playground-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://playground_app:playground_app@postgres:5432/playground?sslmode=disable
      JWT_SECRET: change-me-in-production
      TRUSTED_GATEWAY_HEADERS: "true"
      KAFKA_BROKERS: redpanda:9092
      KAFKA_EXECUTION_TOPIC: playground.execution.completed
      KAFKA_AUTO_CREATE_TOPICS: "true"
    ports:
      - "8080:8080"
